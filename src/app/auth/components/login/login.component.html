<div
  class="w-full max-w-sm mx-auto overflow-hidden bg-white rounded-lg shadow-md dark:bg-gray-800"
>
  <div class="px-6 py-4">
    <h3
      class="mt-3 text-xl font-medium text-center text-gray-600 dark:text-gray-200"
    >
      Welcome Back
    </h3>

    <p class="mt-1 text-center text-gray-500 dark:text-gray-400">
      Login or create account
    </p>

    <form [formGroup]="fg">
      <div class="w-full mt-4">
        <!-- <input
          formControlName="username"
          class="block w-full px-4 py-2 mt-2 text-gray-700 placeholder-gray-500 bg-white border rounded-lg dark:bg-gray-800 dark:border-gray-600 dark:placeholder-gray-400 focus:border-blue-400 dark:focus:border-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring focus:ring-blue-300"
          type="text"
          placeholder="username"
          aria-label="Username"
        /> -->
       
        <select
          id="countries"
          formControlName="username"
          (change)="getSelectedUser($event.target.value)"
          aria-placeholder="Select a username"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        >
          <option selected>select username...</option>
          @for(user of usersList(); track user.id){
            <option [value]="user.username">{{user.username}}</option>

          }
        </select>
      </div>

      <div class="w-full mt-4">
        <input
          formControlName="password"
          class="block w-full px-4 py-2 mt-2 text-gray-700 placeholder-gray-500 bg-white border rounded-lg dark:bg-gray-800 dark:border-gray-600 dark:placeholder-gray-400 focus:border-blue-400 dark:focus:border-blue-300 focus:ring-opacity-40 focus:outline-none focus:ring focus:ring-blue-300"
          type="password"
          placeholder="Password"
          aria-label="Password"
          readonly="true"
        />
      </div>

      <div class="text-right mt-4">
        <button
          (click)="onSubmit()"
          type="submit"
          class="px-6 py-2 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-500 rounded-lg hover:bg-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-50"
        >
          Sign In
        </button>
      </div>
    </form>
  </div>
</div>
