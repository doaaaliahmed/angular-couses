<div class="flex flex-col gap-4">
  <!-- Sticky Search Bar -->
  <div
    class="p-4 rounded-md bg-white/50 dark:bg-gray-700/30 "
  >
    <search-bar
      (filterProductsEventByTitle)="filterProductsByTitle($event)"
      (addProductEvent)="addNewProduct($event)"
    ></search-bar>
  </div>

  <!-- Loading Indicator -->
  <loading></loading>

  <!-- Products List -->
 
  @if (filteredProducts()?.length > 0) {
  <div
    class="flex items-center flex-wrap justify-start gap-4 p-4 bg-white dark:bg-gray-700 rounded-md min-h-screen"
  >
    @for (product of filteredProducts(); track product.id) {
    <product-card
      [product]="product"
      (deleteProductEvent)="delete($event)"
      (editProductEvent)="openDialogToEdit($event)"
    ></product-card>
    }
  </div>
  } @else if (noDataFound()) {
  <h1
    class="w-full h-80 grid place-items-center text-xl font-bold text-gray-800 dark:text-white"
  >
    <span>No data found</span>
  </h1>

  }

 
  <!-- Modals and Alerts -->
  @if (openProductDialog) {
  <add-product-modal
    (closeProductmodal)="onClose($event)"
    (createdProductData)="createProduct($event)"
    (updatedProductData)="updateProduct($event)"
    [productData]="productToUpdate()"
  ></add-product-modal>
  }


</div>
