<nav
  class="bg-gray-100/50 dark:bg-gray-900/50 w-full fixed top-0 left-0 backdrop-blur-md shadow-sm"
>
  <div class="flex flex-wrap items-center justify-between mx-auto py-4 px-10">
    <a
      href="https://flowbite.com/"
      class="flex items-center space-x-3 rtl:space-x-reverse"
    >
      <span
        class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white"
        >Fake Api
      </span>
    </a>
    <div
      class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse"
    >
      <button
        type="button"
        class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
        id="user-menu-button"
        aria-expanded="false"
        data-dropdown-toggle="dropdown"
        data-dropdown-placement="bottom"
        [matMenuTriggerFor]="afterMenu"
      >
        <span class="sr-only">Open user menu</span>
        <img class="rounded-full" src="assets/avatar.svg" alt="user photo" />
      </button>

      <mat-menu #afterMenu="matMenu" xPosition="after">
        @if(isLogin()){
        <div>
          <div class="px-4 py-3">
            <span class="block text-sm text-gray-900">{{user().username}}</span>
            <span class="block text-sm text-gray-500 truncate"
              >{{user().email}}</span
            >
          </div>
        </div>
        <button mat-menu-item (click)="logout()">Sign Out</button>
      
      }
      @else{
        <button mat-menu-item (click)="logout()">Log In</button>
      }
    </mat-menu>
